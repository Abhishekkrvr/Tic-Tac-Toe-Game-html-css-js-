<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 10px;
    }

    #status {
      font-size: 1rem;
      color: #666;
      margin-bottom: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .cell {
      background-color: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 8px;
      height: 90px;
      font-size: 2rem;
      font-weight: bold;
      color: #222;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .cell:hover {
      background-color: #e0e0e0;
    }

    .cell.winner {
      background-color: #d1ffd6;
      color: #2e7d32;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      background-color: #52de59;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #7694ff;
    }

    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>
    <div id="status">Player X's Turn</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button id="resetBtn">🔄️Restart Game</button>

    <footer>
      <p>Created By Abhishek Kr. Verma</p>
    </footer>
  </div>

  <script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");

    let currentPlayer = "X";
    let gameBoard = Array(9).fill("");
    let gameActive = true;

    const winningCombinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    cells.forEach(cell => cell.addEventListener("click", handleClick));
    resetBtn.addEventListener("click", resetGame);

    function handleClick(e) {
      const index = e.target.dataset.index;
      if (gameBoard[index] !== "" || !gameActive) return;

      gameBoard[index] = currentPlayer;
      e.target.textContent = currentPlayer;

      const winCombo = checkWinner();
      if (winCombo) {
        statusText.textContent = `🎉 Player ${currentPlayer} Wins!`;
        highlightWinner(winCombo);
        gameActive = false;
      } else if (gameBoard.every(cell => cell !== "")) {
        statusText.textContent = "😐 It's a Draw!";
        gameActive = false;
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s Turn`;
      }
    }

    function checkWinner() {
      for (let combo of winningCombinations) {
        const [a, b, c] = combo;
        if (
          gameBoard[a] &&
          gameBoard[a] === gameBoard[b] &&
          gameBoard[a] === gameBoard[c]
        ) {
          return combo;
        }
      }
      return null;
    }

    function highlightWinner(combo) {
      combo.forEach(index => cells[index].classList.add("winner"));
    }

    function resetGame() {
      gameBoard.fill("");
      currentPlayer = "X";
      gameActive = true;
      statusText.textContent = `Player ${currentPlayer}'s Turn`;
      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("winner");
      });
    }
  </script>
</body>
</html>
